name: Build Release

# Builds a .zip and .unitypackage for the version in package.json, publishes a
# GitHub release tagged "v<version>" and then asks the VPM listing to rebuild.
# Runs automatically when package.json changes on main. A version that already
# has a release tag is skipped, bumping the version is what publishes.
on:
  workflow_dispatch:
  push:
    branches: main
    paths: package.json

env:
  packageName: com.hfcred.animationrepathing
  packageFileName: animationrepathing
  packageReleaseName: Animation Repathing

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            exists=true
            echo "::notice::Release tag $tag already exists, nothing to release."
          else
            exists=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    name: Build and release
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      packagePath: Packages/${{ env.packageName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set file names
        run: |
          echo "zipFile=${packageFileName}_v${version}.zip" >> "$GITHUB_ENV"
          echo "unityPackage=${packageFileName}_v${version}.unitypackage" >> "$GITHUB_ENV"

      # The .unitypackage must contain paths starting with Packages/<name>/ so
      # Unity imports it as a package, so the repo is staged under that folder.
      - name: Stage package under Packages/
        run: |
          mkdir -p "$packagePath"
          rsync -a --exclude .git --exclude .github --exclude .gitignore --exclude Packages ./ "$packagePath/"

      - name: Create zip
        working-directory: ${{ env.packagePath }}
        run: zip -r "$GITHUB_WORKSPACE/$zipFile" .

      - name: Track package meta files
        run: find "$packagePath" -name '*.meta' > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      - name: Add icon to UnityPackage
        uses: foxscore/add-icon-to-unitypackage@v1
        with:
          package_path: ${{ env.unityPackage }}
          icon_path: .github/thumbnail.png
          package_not_found_behavior: warn
          icon_not_found_behavior: warn
          icon_already_present_behavior: warn

      - name: Make release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.packageReleaseName }} ${{ env.tag }}
          tag_name: ${{ env.tag }}
          generate_release_notes: true
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            package.json

  # Releases created with GITHUB_TOKEN do not fire "release" events, so the
  # listing update is called directly instead of relying on that trigger.
  update-listing:
    name: Update VPM listing
    needs: build
    uses: ./.github/workflows/trigger-repo-update.yml
    secrets: inherit
